<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43" />
      <stop offset="100%" stop-color="#0B1F33" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6A84F" />
      <stop offset="100%" stop-color="#B8862C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded rectangle with --cream (#F7F1E3) border -->
  <rect 
    x="3" 
    y="3" 
    width="58" 
    height="58" 
    rx="16" 
    fill="url(#bgGrad)" 
    stroke="#F7F1E3" 
    stroke-width="3" 
    filter="url(#glow)" 
  />

  <!-- Letter A in bright cream/gold -->
  <text 
    x="32" 
    y="44" 
    font-family="Cinzel, 'Playfair Display', Georgia, serif" 
    font-size="36" 
    font-weight="900" 
    fill="#F7F1E3" 
    text-anchor="middle"
    letter-spacing="-0.5"
  >A</text>
</svg>
